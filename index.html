<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Палео-Квест: T-Rex</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://unpkg.com/ar.js@3.4.0/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader { 
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }
    .arjs-loader.hidden { display: none; }
  </style>
</head>
<body>
  <div class="arjs-loader" id="loader">
    Наведите камеру на маркер из музея...
  </div>

  <a-scene
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    embedded
    id="scene"
  >
    <a-marker type="pattern" url="assets/markers/marker.patt">
      <a-entity
        gltf-model="assets/models/trex.glb"
        scale="0.8 0.8 0.8"
        position="0 0.5 0"
        rotation="0 180 0"
        animation="property: rotation; to: 0 540 0; loop: true; dur: 20000"
        id="trex"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Скрываем загрузчик после инициализации AR
    document.querySelector('#scene').addEventListener('renderstart', () => {
      document.getElementById('loader').classList.add('hidden');
    });
  </script>
</body>
</html>
